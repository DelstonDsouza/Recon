apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo-staging
resources:
  - ../../base
  - namespace.yaml
configurations:
  - rollout-config.yaml
patches:
  - path: rollout-patch.yaml
    target:
      kind: Rollout
      name: podinfo
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.7.1
